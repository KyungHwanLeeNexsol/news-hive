surge_detection:
  theme_cluster:
    keywords: ["반도체", "배터리", "수소", "전기차", "AI", "로봇", "방위산업", "바이오", "원전"]
    sector_theme_map:
      반도체: ["IT서비스", "전자장비와기기", "반도체와반도체장비"]
      배터리: ["화학", "전기장비"]
      수소: ["화학", "에너지장비및서비스"]
      전기차: ["자동차", "자동차부품", "전기장비"]
      AI: ["IT서비스", "소프트웨어"]
      로봇: ["IT서비스", "기계", "전자장비와기기"]
      방위산업: ["기계", "우주항공과국방"]
      바이오: ["제약", "생물공학", "생명과학도구및서비스"]
      원전: ["전기유틸리티", "에너지장비및서비스"]
    cluster_window_hours: 48
    min_article_count: 2
    min_market_cap_krw: 100000000000
  volume_news_combo:
    volume_zscore_threshold: 2.5
    volume_baseline_days: 20
    news_window_hours: 24
    min_news_sentiment: 0.3
  disclosure_pattern:
    historical_surge_threshold_pct: 10.0
    historical_lookback_days: 5
    min_surge_rate: 0.40
    min_sample_size: 20
    cache_ttl_hours: 24
    disclosure_window_hours: 24
  ensemble:
    weights:
      theme_cluster: 0.25
      volume_news_combo: 0.30
      disclosure_pattern: 0.25
      legacy_detectors: 0.20
    min_score_for_signal: 0.20
  backtest:
    enabled: true
    evaluation_horizon_days: 5
