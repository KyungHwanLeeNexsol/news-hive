surge_detection:
  theme_cluster:
    # SPEC-AI-037 REQ-037-001: 7개 신규 테마 추가 (게임/엔터/조선/해운/건설/음식료/화학소재)
    keywords: ["반도체", "배터리", "수소", "전기차", "AI", "로봇", "방위산업", "바이오", "원전", "항공", "5G", "보안칩", "K뷰티", "게임", "엔터", "조선", "해운물류", "건설부동산", "음식료", "화학소재"]
    sector_theme_map:
      반도체: ["IT서비스", "전자장비와기기", "반도체와반도체장비", "전기장비", "디스플레이장비및부품"]
      배터리: ["화학", "전기장비", "자동차부품"]
      수소: ["화학", "에너지장비및서비스"]
      전기차: ["자동차", "자동차부품", "전기장비"]
      AI: ["IT서비스", "소프트웨어", "통신장비", "전자장비와기기", "전자제품", "복합기업"]
      로봇: ["IT서비스", "기계", "전자장비와기기", "전자제품"]
      방위산업: ["기계", "우주항공과국방"]
      바이오: ["제약", "생물공학", "생명과학도구및서비스", "건강관리장비와용품", "건강관리업체및서비스"]
      원전: ["전기유틸리티", "에너지장비및서비스"]
      항공: ["항공사", "항공화물운송과물류"]
      5G: ["통신장비", "IT서비스", "소프트웨어", "복합기업"]
      보안칩: ["통신장비", "반도체와반도체장비", "소프트웨어", "IT서비스"]
      K뷰티: ["화장품", "건강관리업체및서비스", "섬유,의류,신발,호화품"]
      # SPEC-AI-037 REQ-037-001: 신규 7개 테마 — 섹터명은 _SNAPSHOT 기준 검증 완료
      게임: ["게임엔터테인먼트", "소프트웨어", "IT서비스"]
      엔터: ["방송과엔터테인먼트", "양방향미디어와서비스", "광고", "섬유,의류,신발,호화품"]
      조선: ["조선", "기계"]
      해운물류: ["해운사", "항공화물운송과물류", "운송인프라", "도로와철도운송"]
      건설부동산: ["건설", "부동산", "건축자재", "건축제품"]
      음식료: ["식품", "음료", "식품과기본식료품소매"]
      화학소재: ["화학", "철강", "비철금속", "포장재"]
    cluster_window_hours: 48
    min_article_count: 2
    # SPEC-AI-037 REQ-037-003: 500억(50_000_000_000)으로 하향 — 소형 테마주 커버리지 확대
    min_market_cap_krw: 50000000000
  volume_news_combo:
    # 재활성화 (2026-06-11): "6/6 실패" 평가는 CSS 버그(2026-05-20~06-10) 기간 actual_surge_count=0
    # 오기록으로 평가 자체가 무효. SPEC-AI-030 게이트(overheat/freshness/companion) 가 추격매수 방지
    enabled: true
    # SPEC-AI-038 REQ-038-001: 2.5→2.0으로 완화 — combo 신호 감도 향상 (BEAR 시 3.0→2.5 별도 오버라이드)
    volume_zscore_threshold: 2.0
    volume_baseline_days: 20
    news_window_hours: 24
    min_news_sentiment: 0.5
  # SPEC-AI-042 REQ-042-008: 장전 갭업 조기 진입 임계값
  # 0 <= change_rate < gap_entry_threshold → 조기 진입, >= threshold → skip(갭풀백 위임)
  gap_entry_threshold: 0.05
  disclosure_pattern:
    historical_surge_threshold_pct: 10.0
    historical_lookback_days: 5
    min_surge_rate: 0.40
    min_sample_size: 20
    cache_ttl_hours: 24
    disclosure_window_hours: 24
  # SPEC-AI-039 REQ-039-001: carry-over 최대 거래일 제한
  carryover:
    max_trading_days: 3  # 최대 carry-over 거래일 수 (3 거래일 ≈ 5 역일)
  ensemble:
    weights:
      # SPEC-AI-039 REQ-039-002: news_delayed 탐지기 추가 (0.15), 기존 가중치 재조정
      # theme_cluster: 0.28→0.25, volume_news_combo: 0.35→0.32
      # disclosure_pattern: 0.20→0.18, legacy_detectors: 0.17→0.10, news_delayed: 0.00→0.15
      # SPEC-AI-050 REQ-5: legacy_detectors 0.10→0.00, weekend_gap_up 0.10 신규 추가 (합계 유지 1.0)
      # volume_breakout 0.12 신규 추가 — 소형주 커버리지 확장 (가중치 재배분, 합계 유지 1.0)
      # theme_cluster: 0.25→0.22, volume_news_combo: 0.32→0.28
      # disclosure_pattern: 0.18→0.16, news_delayed: 0.15→0.13, weekend_gap_up: 0.10→0.09
      # SPEC-AI-065 REQ-3: momentum_continuation 0.12 신규 추가 — 8번째 탐지기
      # 기존 7개 가중치를 0.88 비율로 축소하여 합계 1.0 유지
      # theme_cluster: 0.22→0.19, volume_news_combo: 0.28→0.25
      # disclosure_pattern: 0.16→0.14, news_delayed: 0.13→0.11
      # weekend_gap_up: 0.09→0.08, volume_breakout: 0.12→0.11
      theme_cluster: 0.19
      volume_news_combo: 0.25
      disclosure_pattern: 0.14
      legacy_detectors: 0.00
      news_delayed: 0.11
      weekend_gap_up: 0.08
      volume_breakout: 0.11
      momentum_continuation: 0.12
    min_score_for_signal: 0.38  # 2026-06-30: EV guard 과잉조정 복구, BEAR threshold 0.42 이하로 복구
    # 레짐별 앙상블 임계값 (SPEC-AI-017 REQ-001): 시장 레짐에 따라 차등 적용
    # BULL 장에서는 진입 문턱 낮춰 더 많은 시그널 허용 (0.38), SIDEWAYS/BEAR는 높임
    # 2026-06-05: BEAR 0.52→0.42, SIDEWAYS 0.50→0.45 완화 — BEAR 4일째 탐지 0건 문제 해결
    regime_thresholds:
      BULL: 0.38
      SIDEWAYS: 0.45
      BEAR: 0.42
    # 컨센서스 배율 (SPEC-AI-017 REQ-002): 복수 탐지기 발동 시 점수 증폭
    # 기존 1.15/1.30 → 1.30/1.55로 상향해 복합 신호 보상 강화
    consensus_multiplier_two: 1.30
    consensus_multiplier_three_plus: 1.55
    # SPEC-AI-018 REQ-002: 강한 단일 신호 우회 임계값 0.72→0.85 (단일 신호 남용 방지)
    # theme_cluster 또는 combo_score >= 이 값이면 앙상블 임계 우회
    strong_single_bypass_threshold: 0.85
    # SPEC-AI-018 REQ-001: 즉각 공시 우회 임계값 (하드코딩 0.70에서 설정값으로 이전)
    # immediate_disclosure_score >= 이 값이면 앙상블 임계값 우회 허용
    immediate_disclosure_bypass_threshold: 0.85
    # SPEC-AI-100 REQ-AI100-001~003: 탐지기 지평(horizon) 인식 임계값 (기본 비활성).
    # enabled=false인 동안 이 섹션은 전혀 조회되지 않으며, 기존 regime_thresholds
    # 단일 레짐 조회 경로만 동작한다(바이트 동일 동작, REQ-AI100-003).
    horizon_aware_thresholds:
      enabled: false
      # REQ-AI100-006/SPEC-AI-101 REQ-AI101-003: 섀도우 모드 관측 스위치. SPEC-AI-101이
      # REQ-AI101-004 영속화(SurgeHorizonShadowObservation) 구현 완료 후 true로 전환한다
      # (design.md §E 순서 제약). enabled는 이 전환과 무관하게 계속 false로 유지된다.
      shadow_mode_enabled: true
      # Open Question 1(잠정값) — volume_news_combo는 구현 시 도메인 검증 후 확정.
      horizon_labels:
        theme_cluster: multi_day
        volume_news_combo: same_day
        disclosure_pattern: same_day
        legacy_detectors: multi_day
        news_delayed: multi_day
        weekend_gap_up: multi_day
        volume_breakout: same_day
        momentum_continuation: next_day
      # Open Question 2: 최종 확정 전까지 기존 regime_thresholds와 동일 값으로 초기화
      # (플래그가 켜져도 당장은 동작 변화가 없도록, 안전한 초기 배포).
      thresholds:
        BULL:
          same_day_dominant: 0.38
          next_day_dominant: 0.38
          multi_day_dominant: 0.38
          mixed: 0.38
        SIDEWAYS:
          same_day_dominant: 0.45
          next_day_dominant: 0.45
          multi_day_dominant: 0.45
          mixed: 0.45
        BEAR:
          same_day_dominant: 0.42
          next_day_dominant: 0.42
          multi_day_dominant: 0.42
          mixed: 0.42
  # DEPRECATED by SPEC-AI-020 — schema preserved for future use, filter removed
  # (REQ-AI020-005: 스키마 보존, 필터링 미적용 — 모멘텀-가치 시간축 불일치 교정)
  valuation_disqualifiers:
    max_per: 500
    max_pbr: 30
    skip_if_missing: true
  # REQ-018-004: 레짐별 탐지기 파라미터 — BULL/BEAR 국면별 탐지 민감도 차등 적용
  regime_detector_params:
    BULL:
      volume_zscore_threshold: 2.0
      news_window_hours: 72
      min_news_sentiment: 0.20
    BEAR:
      # SPEC-AI-038 REQ-038-001: 3.0→2.5으로 완화 — BEAR 시 과도한 combo 차단 방지
      volume_zscore_threshold: 2.0  # P2 fix 2026-06-30: 2.5->2.0 BEAR regime too strict
      # 2026-06-05: 0.50→0.35 완화 — 대원제약 ADA 발표(neutral 뉴스 11건) 미탐지 분석 결과
      # neutral 뉴스도 포함해야 ADA/임상 류 이벤트 포착 가능
      # SPEC-AI-050 REQ-2: 12→24 상향 — BEAR 국면 주말 직후 뉴스 커버리지 부족 보완, 24h 클램프 하한
      news_window_hours: 24
      min_news_sentiment: 0.35
  price_query:
    batch_size: 10
    batch_delay_sec: 0.5
    retry_count: 1
  backtest:
    enabled: true
    evaluation_horizon_days: 5
    # SPEC-AI-069 REQ-AI069-001: 운영 게이트 floor — 초기 보수적 값, Phase 2 데이터 축적 후 조정
    gate:
      min_signals: 20
      min_directional_accuracy: 0.50
      lookback_days: 30
  # SPEC-AI-028 REQ-001/002: 공시 유형별 역신호 필터링 설정
  # 제외 키워드(exclusion_patterns): 해당 공시는 시그널 생성 자체를 차단
  # 페널티 키워드(penalty_patterns): 즉시 시그널 점수에 penalty_factor 배율 적용
  disclosure_type_filter:
    exclusion_patterns:
      - "유상증자"
      - "전환사채발행"
      - "신주인수권"
      - "주식매수선택권"
    penalty_patterns:
      - "최대주주변경"
      - "손실"
      - "영업손실"
    penalty_factor: 0.3
    skip_bearish_in_today_signals: true
    # SPEC-AI-066 REQ-AI066-003: 전략적 인수/경영권 프리미엄 공시 페널티 부분완화
    # 인수 키워드 + positive 감성 + change_rate>=0 3중 충족 시 penalty_factor(0.3)→acquisition_penalty_factor(0.7)
    acquisition_exemption_enabled: true
    acquisition_penalty_factor: 0.7
  # SPEC-AI-029 REQ-AI029-001: 적응형 surge_probability 임계값 설정
  adaptive_threshold:
    enabled: true
    # 2026-06-05: 5→10 — 표본 크기 확대로 단기 손절 연속에 의한 임계값 급등 방지
    win_rate_window: 10
    win_rate_floor: 0.40
    win_rate_addition: 0.05
    win_rate_cap: 0.70
    regime_multipliers:
      # 2026-06-05: BEAR 1.05→1.00 — 탐지 임계값(0.42)이 이미 낮으므로 추가 배율 불필요
      BEAR: 1.00
      SIDEWAYS: 1.0
      BULL: 0.9
    # P2: 0.45→0.50 — 거래 데이터 부족/리셋 후 fallback 임계값을 0.50으로 상향
    final_clamp_min: 0.50
    # 2026-06-05: 0.65→0.55 — 최악 상황에서도 임계값 0.55 이하로 제한
    final_clamp_max: 0.55
    # SPEC-AI-037 REQ-037-002: 0.7→0.55로 하향 — 비테마 종목 이중 페널티 완화
    combo_zero_theme_floor: 0.55
  # SPEC-AI-030 REQ-AI030-001~004: volume_news_combo 추격매수 방지 게이트 설정
  # enabled=False이면 4개 게이트 전부 비활성 (레거시 동작 복원)
  combo_chase_guard:
    enabled: true
    overheat_change_pct: 5.0
    # SPEC-AI-066 REQ-AI066-002: 확신도 HIGH 전용 상향 과열 상한 (non-HIGH는 overheat_change_pct 유지)
    overheat_change_pct_high_conviction: 15.0
    min_freshness_ratio: 1.5
    distribution_change_pct: 0.0
    # 2026-06-12: true→false — Naver API 실패 시 combo 시그널 전체 차단 방지
    # price 조회 실패 = overheat 게이트 스킵 (price_at_signal=null로 기록됨)
    exclude_on_price_unavailable: false
    require_companion_detector: true
  # SPEC-AI-103 REQ-AI103-001~004: theme_cluster 뉴스 신선도/중복(dedup) 가드
  # enabled=false이면 모든 경로 비활성 — 본 SPEC 적용 이전과 바이트 동등 (REQ-AI103-002)
  # 활성화는 REQ-AI103-007 디버그 로그를 최소 5거래일 관측한 뒤 별도 판단 (spec.md D5)
  theme_freshness_guard:
    enabled: false
    duplicate_title_similarity_threshold: 0.85
    duplicate_dedup_window_hours: 6.0
    # D4 하드 캡: dedup 쌍대 비교 비용을 O(200²)로 구조적 유계화
    dedup_max_comparison_batch: 200
    # 0.0 = 감쇠 미발동 (enabled=true로 켜도 이 값이 0.0이면 theme_base 감쇠 없음)
    min_theme_freshness_ratio: 0.0
    # null이면 cluster_window_hours / 2 (=24h)로 파생
    fresh_window_hours: null
    freshness_discount_factor: 0.5
    # REQ-AI103-004: sector_only_max_candidates가 null이면 이 서브기능은 무조건 스킵
    price_overheat_enabled: false
    price_overheat_change_pct: 15.0
    price_overheat_discount_factor: 0.5
  # SPEC-AI-039 REQ-039-003: 고임팩트 뉴스 키워드 가중치 설정
  # 기술이전/임상/수주 등 급등 트리거 이벤트를 일반 뉴스보다 차별화 탐지
  high_impact_news:
    tech_transfer:
      - "기술이전"
      - "로열티"
      - "기술수출"
    tech_transfer_multiplier: 2.0
    clinical:
      - "임상"
      - "FDA"
      - "허가"
      - "승인"
    clinical_multiplier: 1.8
    contract:
      - "수주"
      - "계약체결"
      - "파트너십"
    contract_multiplier: 1.5
  # SPEC-AI-060: 종목별 개별 원인 분석 설정
  per_stock_analysis:
    enabled: true
    max_calls_per_run: 8
    call_delay_sec: 1.0
    fn_priority_over_tp: true
    skip_if_no_context: true
  # 거래량 폭발 소형주 탐지기 — 뉴스/공시 없이 거래량만으로 소형주 급등 포착
  # Naver 거래량 순위 상위 100개 종목 대상, 20일 평균 대비 3배 이상 거래량 폭발 탐지
  volume_breakout:
    enabled: true
    max_candidates: 100
    volume_ratio_threshold: 3.0
    baseline_days: 20
    min_history_days: 10
    confidence_denominator: 8.0
    max_score: 0.50
    # SPEC-AI-063 REQ-063-002: volume_breakout 단독 bypass 임계값
    # volume_breakout_score >= 이 값이면 앙상블 임계값 우회 허용 (standalone 소형주 시그널)
    # auto-improver 조정 범위: [0.20, 0.45] (REQ-063-005)
    volume_breakout_bypass_threshold: 0.30
    # SPEC-AI-066 REQ-AI066-005: 촉매 종목 유니버스 확장 + 종목별 상대 임계
    # SPEC-AI-079: staged rollout 종료, 프로덕션 활성화 (2026-07-13)
    relative_threshold_enabled: true
  # SPEC-AI-065 REQ-3: 모멘텀 연속 탐지기 — 전일 등락률 5~15% 종목 익일 모멘텀 연속 패턴
  momentum_continuation:
    enabled: true
    # 탐지 기준: 전일 등락률 [5%, 15%] 범위
    min_change_rate: 5.0
    max_change_rate: 15.0
    # 기본/최대 confidence
    base_score: 0.40
    max_score: 0.70
    # BEAR 레짐 점수 감쇠율
    bear_dampening: 0.7
    min_history_days: 5
  # SPEC-AI-065 REQ-1: z-score 기준선 설정
  zscore_min_baseline_samples: 10
  # SPEC-AI-065 REQ-2: 스캔 유니버스 최대 크기
  # SPEC-AI-096 REQ-AI096-001: 150→250 상향(clamp [50,600] 내, 플래그 아님 — 평가지표
  # scannable_recall/coverage/surge_type 분모가 배포 즉시 이동한다).
  max_scan_universe: 250
  # SPEC-AI-076 REQ-AI076-007: 풀별 최소 슬롯 예약(quota floor) — 0이면 레거시 엄격
  # concat-then-slice와 동일(백워드 호환). sum(floors) > max_scan_universe면 안전 축소.
  pool_b_min_slots: 20
  pool_c_min_slots: 30
  # SPEC-AI-078 REQ-AI078-005: Pool A 후보를 impact_score 내림차순(NULL 최후순위)으로
  # 정렬할지 여부 — false면 레거시 DB-순서(무순위) 거동으로 복귀(백워드 호환).
  pool_a_rank_by_impact: true
  # SPEC-AI-086 REQ-AI086-003: Pool D(뉴스 언급 기반) 최소 슬롯 예약(quota floor).
  # SPEC-AI-104 REQ-AI104-002: 0(비활성) → 10(canary 값, SPEC-AI-096 D3 제안값 계승)으로
  # 관측 목적 최소 침습 전환. Pydantic 모델 기본값(surge_settings.py)은 0으로 무변경 —
  # 이 canary 전환은 배포 config에만 적용된다(§Decisions D1). 탐지·매매 경로 무영향
  # 불변식은 REQ-AI104-003 [HARD] 참고 — merged(1차 탐지기 후보)로 재투입되지 않는다.
  pool_d_min_slots: 10
  # SPEC-AI-086 REQ-AI086-004: 장중 시간대별 동적 스캔 상한(선택, 기본 비활성).
  # 예: {premarket_early: 200, close_final: 250} — 빈 dict(기본)면 max_scan_universe
  # 단일 평탄 상한으로 폴백한다.
  dynamic_scan_universe_caps: {}
  # SPEC-AI-089 REQ-AI089-001 / SPEC-AI-104 REQ-AI104-004: 스캔 유니버스↔탐지망 간극
  # 실시간 측정 계측 토글. false(기본)→true — Pool D canary 관측 창(위 pool_d_min_slots) 동안
  # measure_universe_detection_gap()이 매 스캔 사이클마다 실행되도록 활성화한다. 순수
  # 읽기·집계이며 탐지 파이프라인 출력에 영향을 주지 않는다(REQ-AI089-003 [HARD] 불변식).
  universe_gap_measurement_enabled: true
  # SPEC-AI-066 REQ-AI066-001/006: 촉매 확신도 기반 조건부 완화 설정
  # enabled=false이면 REQ-002/003 완화 전면 비활성 → SPEC-AI-030/028 레거시 동작 복원
  catalyst_conviction:
    enabled: true
    # HIGH 확신도 승격 임계 — 지속적 다출처 커버리지 요건 (순간 펌프 위장 방지)
    min_article_count_high: 5
    min_coverage_hours_high: 6.0
    min_sentiment_high: 0.5
    # 고임팩트 인수/합병 촉매 키워드 (기존 high_impact_news 키워드에 더해 사용)
    acquisition_keywords:
      - "인수"
      - "합병"
      - "경영권"
      - "M&A"
      - "지분인수"
      - "지분취득"
    # REQ-004: 뉴스 공동언급 테마 자동 확장 (staged rollout)
    comention_theme_enabled: false
    comention_min_pairs: 3
    # REQ-007: 고임팩트 뉴스 이벤트 구동 재스캔 (staged rollout, LLM 예산 가드)
    # SPEC-AI-083 REQ-AI083-008: 뉴스 기반 이벤트 재스캔 활성화(false→true, 2026-07-21 사용자
    # 승인). 인프라(_maybe_trigger_event_rescan, 가드 포함)는 SPEC-AI-066에서 이미 구현됨 —
    # 본 변경은 설정 플립만. 가드 값(쿨다운 30분/일일 20회)은 불변([X-8]). 롤백=false 복귀.
    event_rescan_enabled: true
    event_rescan_cooldown_minutes: 30
    max_daily_event_triggers: 20
  # SPEC-AI-067 REQ-AI067-007: 장중 당일 거래량 실시간성 개선
  # combo z-score / volume_breakout / Pool B의 "당일 거래량"을 장중에 한해 Naver 모바일 API
  # accumulatedTradingVolume(실시간)로 교정. sise_day "오늘" 행은 장중 지연(최대 4.0x 과소).
  # enabled=false → 세 호출부 모두 sise_day 당일값 사용 (레거시 동등).
  intraday_live_volume:
    enabled: true
    # 장중에만 실시간 조회 (장외엔 완결된 sise_day 사용)
    market_hours_only: true
    # 스캔당 실시간 조회 상한 (초과분 sise_day 폴백, 레이트리밋 유계)
    max_live_fetches_per_scan: 80
  # SPEC-AI-069 REQ-AI069-004: z-score 상대채점 회귀 격리 — false(기본)이면 AI-065 이전
  # 절대채점(raw score)으로 폴백. 재활성(true)은 backtest 재도출·통과 이후에만.
  relative_scoring:
    zscore_enabled: false
  # SPEC-AI-069 REQ-AI069-002: 자동개선 전면 중단 스위치 — 기본 false(REQ-002 확정 상태).
  # true 재활성은 REQ-003(backtest 가드 + Scannable Recall) 충족 이후에만.
  auto_improve_enabled: false
  # SPEC-AI-080: 동일-당일 고확신 공시 촉매 즉시 급등 시그널 발화.
  # 2026-07-16 활성화(evaluator-active 독립 검증 PASS, 전체 회귀 2001 passed 확인 후 배포).
  # disclosure_impact_scorer.process_disclosure_impact()가 고확신 이벤트 클래스
  # (자사주소각/단일판매공급계약/흡수합병 등) + impact_score>=min_impact 공시를
  # 30분 반영-갭 게이트 없이 즉시 surge_candidate로 발화한다.
  immediate_surge:
    enabled: true
    min_impact: 40.0
    batch_cutoff_hour: 15
    batch_cutoff_minute: 20
  # SPEC-AI-081: 공시 충격 스코어링 flat-base 카테고리(주요사항보고/지분공시) 콘텐츠 인식 정밀화.
  # 2026-07-16 활성화(evaluator-active 독립 검증 PASS, 전체 회귀 2001 passed 확인 후 배포).
  # 최대주주 지배권 변경 키워드 정규화 매칭(REQ-001) + 희석성 증권 발행결정 로컬 재분류
  # (REQ-002, 발행공시 경로로 라우팅)가 활성화된다.
  disclosure_content_aware_scoring:
    enabled: true
